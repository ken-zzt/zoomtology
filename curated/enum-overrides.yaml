arrays:
  - array: order_status_string          # ZZTOrderInfo::$order_status_string, ZZTPayment::$order_status_string, ModelAccountOrder 등
    column: zoom_order.order_status_id

values:
  - column: zoom_order.order_status_id
    values:
      "0": {meaning: 신규(결제 전), label: created, note: "주문 생성 시 기본값. 예약 상태(zoom_ms_requestpayment.status_id)에도 복사된다 — reservation-status-flow.md 1절"}
      "1": {meaning: 예약요청, label: book_requested}
      "2": {meaning: 예약확정, label: book_confirmed}
      "3": {meaning: 예약거절, label: book_rejected}
      "4": {meaning: 결제실패(미사용), label: payment_failed, note: "코드에 상수만 있고 어디서도 쓰지 않는다 — status-codes.md"}
      "5": {meaning: 환불, label: refund}
      "6": {meaning: 예약대기, label: book_pending}
      "81": {meaning: 결제시작, label: payment_started, note: "zoomzoom-api OrderStatus 에만 있고 zoom_order.order_status_id 에만 쓰인다 — status-codes.md"}
