[project]
name = "zoomtology"
version = "0.1.0"
description = "줌줌투어 지식그래프 추출기·빌드 — 코드·스키마·문서에서 메타데이터만 뽑아 번들을 만든다"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
zoomtology = "zoomtology.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zoomtology"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
